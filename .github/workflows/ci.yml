name: diagnostic-mirror

on:
  pull_request:
  push:
    branches: [main]

# This public mirror cannot reach the local Jeryu forge and is never a release,
# merge, or installation authority. It runs static drift/syntax checks only.
# GENERATED identity is still kept in lockstep with tool-manifest.toml.
env:
  # BEGIN GENERATED JANKURAI WORKFLOW PIN — DO NOT EDIT
  JANKURAI_REPO: "http://127.0.0.1:8787/git/jeryu/jankurai.git"
  JANKURAI_TAG: "v1.6.11-deadlang-precision-split.2"
  JANKURAI_REV: "4dfbdfa3585f1928d5f996d7b5e14608dff14a03"
  JANKURAI_VERSION: "jankurai 1.6.11"
  JANKURAI_SEMVER: "1.6.11"
  JANKURAI_SOURCE_TREE: "7e5d501aa6f0ee6ced9a48c6288a9943d0b9573c"
  JANKURAI_SOURCE_ARCHIVE_SHA256: "1aa3d178dec0fbb8d0657dd465ea6fda830ffc4ec1f65560b7b7d1682fd87e69"
  JANKURAI_CARGO_LOCK_SHA256: "b9acb981c326226a687d0b6703e4f7ee303148e9e1a6dda1aa03d77988820f6a"
  JANKURAI_BINARY_SHA256: "96d99e6e7d8dc9cf23df1081edd1f975231456592f81d9405385219a2c7298aa"
  JANKURAI_RUST_TOOLCHAIN: "1.95.0"
  JANKURAI_RUSTC_VERSION: "rustc 1.95.0 (59807616e 2026-04-14)"
  JANKURAI_CARGO_VERSION: "cargo 1.95.0 (f2d3ce0bd 2026-03-21)"
  JANKURAI_TARGET_TRIPLE: "x86_64-unknown-linux-gnu"
  JANKURAI_BUILD_MODE: "cargo-install-locked-offline-path-v1"
  # END GENERATED JANKURAI WORKFLOW PIN

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-diagnostic:
    name: non-authoritative-static-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Static pin drift
        run: bash ops/ci/fast.sh
      - name: Shell syntax
        run: >-
          bash -n ops/install-jankurai.sh ops/qualify-jankurai-candidate.sh
          ops/test-install-jankurai.sh ops/test-render-tool-manifest.sh
          ops/ci/check.sh ops/ci/fast.sh ops/ci/lib.sh ops/ci/pr-ci.sh
          scripts/ci-doctor.sh
      - name: Locked Rust control tools
        run: |
          cargo test --locked --offline --all-targets
          bash ops/registry-summary.sh --check
      - name: Security lane
        run: bash ops/ci/security.sh
      - name: Jankurai audit lane
        run: bash ops/ci/score.sh
  security:
    name: security-secret-dependency-workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Secret scan, dependency policy, and workflow lint
        run: bash ops/ci/security.sh
