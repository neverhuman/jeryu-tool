command = "just fast"
purpose = "verify generated Jankurai consumers match the governed manifest"

[[lane]]
name = "check"
command = "just check"
purpose = "run deterministic registry, installer, renderer, and metadata checks"

[[lane]]
name = "score"
command = "just score"
purpose = "audit repository conformance at the governed floor and ratchet"

[[lane]]
name = "security"
command = "just security"
purpose = "run workflow, secret, and repository security checks"

[[lane]]
name = "artifact-support"
command = "just artifact-support"
purpose = "verify artifact-support bootstrap inputs"

[[lane]]
name = "ci"
command = "just fast && just check && just score"
